name: Playwright Visual Regression Tests

on:
  push:
    branches: [main]

# A new push to main cancels the in-flight Playwright run on the same
# ref. Without this, a rapid wave of PR merges (e.g. the 2026-05-19 night
# of merges) stacks 7+ concurrent visual-regression suites on the
# GitHub-hosted runner pool, starving every other workflow in the repo.
# The group key is parameterised on github.ref so the pattern stays safe
# if pull_request is ever added to triggers — each PR ref then gets its
# own isolated cancellation group instead of cancelling another PR's run.
concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      
      - name: Run Playwright tests
        run: npx playwright test e2e/kids-foundation.spec.ts --project=chromium
        env:
          CI: true
      
      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
      
      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 7
      
      - name: Comment PR with results
        if: github.event_name == 'pull_request' && failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ Visual regression tests failed. Check the uploaded artifacts for details.'
            })
