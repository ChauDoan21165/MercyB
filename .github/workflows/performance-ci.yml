name: Performance CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Run checks in parallel
  validate:
    name: Validate Rooms
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run validate-rooms

  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run test

  bundle-size:
    name: Bundle Size Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Check bundle sizes
        run: |
          echo "Checking bundle sizes..."
          MAIN_SIZE=$(stat -f%z "dist/assets/index-*.js" | awk '{print $1}')
          MAX_SIZE=500000  # 500KB
          if [ $MAIN_SIZE -gt $MAX_SIZE ]; then
            echo "❌ Main bundle too large: $MAIN_SIZE bytes (max: $MAX_SIZE)"
            exit 1
          fi
          echo "✅ Bundle size OK: $MAIN_SIZE bytes"

  lighthouse:
    name: Lighthouse Performance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          # Static-dir mode (issue #56 option 2): no live server needed.
          # Lighthouse spins up an internal static server over `./dist`,
          # produced by the preceding `npm run build` step. Sidesteps the
          # deprecated /vip/vip1 URL reference; that route cleanup lands
          # separately under the VIP-audit issue (#60).
          staticDistDir: ./dist
          uploadArtifacts: false
          temporaryPublicStorage: true
      - name: Upload Lighthouse results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-${{ github.run_id }}
          path: .lighthouseci/
          if-no-files-found: ignore
