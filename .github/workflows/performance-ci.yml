name: Performance CI

# Performance/size coverage moved OFF pull_request (CI-quota consolidation).
# The validate/lint/test jobs that used to live here are now in ci.yml
# (the single PR workflow). This runs nightly + on main + on demand.

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  bundle-size:
    name: Bundle Size Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Check bundle sizes
        run: |
          echo "Checking bundle sizes..."
          MAIN_SIZE=$(stat -f%z "dist/assets/index-*.js" | awk '{print $1}')
          MAX_SIZE=500000  # 500KB
          if [ $MAIN_SIZE -gt $MAX_SIZE ]; then
            echo "❌ Main bundle too large: $MAIN_SIZE bytes (max: $MAX_SIZE)"
            exit 1
          fi
          echo "✅ Bundle size OK: $MAIN_SIZE bytes"

  lighthouse:
    name: Lighthouse Performance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          staticDistDir: ./dist
          uploadArtifacts: false
          temporaryPublicStorage: true
      - name: Upload Lighthouse results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-${{ github.run_id }}
          path: .lighthouseci/
          if-no-files-found: ignore
