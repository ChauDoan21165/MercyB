name: Production Deployment

# Real Vercel production deploy on every push to main. Replaces the
# former Lovable-era no-op stub that built an artifact, echoed
# "live on Lovable hosting", and reported a GREEN success without ever
# deploying anything (masked the 2026-05-18 stuck-deploys incident).
# This workflow FAILS LOUD (red) if the build or deploy fails — no
# more silent green. Preview deploys remain Vercel's responsibility
# (PRs); this is main → production only.

on:
  push:
    branches:
      - main
  workflow_dispatch:   # manual: fire a real prod deploy on demand

# Serialize production deploys; NEVER cancel one mid-flight.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Vercel Production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      # Sentry sourcemap upload. vite.config.ts only activates
      # @sentry/vite-plugin when ALL THREE of these are present, so the
      # `npm run build` invoked by `vercel build` (which inherits this
      # runner env) can de-mangle prod stack traces in Sentry. ORG and
      # PROJECT are NOT secret — hardcoded to the canonical values so the
      # only manual step is adding the SENTRY_AUTH_TOKEN GitHub secret
      # (Settings → Secrets and variables → Actions). If the token is
      # absent the plugin is a silent no-op and the deploy still ships —
      # sourcemap upload is optional and prod deploy must never depend
      # on it (CLAUDE.md: core path survives optional failures).
      SENTRY_ORG: chau-doan
      SENTRY_PROJECT: mercyblade-web
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      # Explicit release-tag pin (A14b-fix-1). Vercel's `vercel build`
      # detects git context and sets VERCEL_GIT_COMMIT_SHA on its own
      # in practice, but exporting it here as the GitHub Actions
      # commit SHA makes the runtime release tag and the
      # @sentry/vite-plugin upload release tag share a contract, not
      # a default-coincidence. vite.config.ts reads
      # process.env.VERCEL_GIT_COMMIT_SHA for both: the `define` block
      # that inlines it as VITE_VERCEL_GIT_COMMIT_SHA for the runtime
      # Sentry init, and the sentryVitePlugin's `release.name` for
      # the upload. With this var explicitly set, both sides are
      # guaranteed to use ${{ github.sha }}.
      VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Match the Vercel project's configured runtime (.vercel
          # project nodeVersion = 24.x) so the local build matches prod.
          node-version: '24'

      - name: Verify required Vercel secrets are present
        run: |
          set -euo pipefail
          missing=()
          [ -n "${VERCEL_TOKEN:-}" ]      || missing+=("VERCEL_TOKEN")
          [ -n "${VERCEL_ORG_ID:-}" ]     || missing+=("VERCEL_ORG_ID")
          [ -n "${VERCEL_PROJECT_ID:-}" ] || missing+=("VERCEL_PROJECT_ID")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing GitHub Actions secret(s): ${missing[*]}. Add them under Settings → Secrets and variables → Actions before this workflow can deploy."
            exit 1
          fi
          echo "::add-mask::$VERCEL_TOKEN"
          echo "All three Vercel secrets present."

      - name: Sentry sourcemap upload status (non-blocking)
        # Make the skip VISIBLE instead of silent: the brief requires
        # "fail gracefully if token wrong, not silently skip". A wrong
        # token fails the build loud (the @sentry/vite-plugin throws on
        # auth error during `vercel build`). A *missing* token is the
        # legitimate opt-out path — we surface it as a CI warning here
        # but never `exit 1`, because blocking prod deploys on an
        # optional observability feature violates "core path survives
        # optional failures".
        run: |
          set -euo pipefail
          if [ -n "${SENTRY_AUTH_TOKEN:-}" ]; then
            echo "::add-mask::$SENTRY_AUTH_TOKEN"
            echo "SENTRY_AUTH_TOKEN present — sourcemaps will upload to ${SENTRY_ORG}/${SENTRY_PROJECT}."
          else
            echo "::warning::SENTRY_AUTH_TOKEN is not set. Production sourcemaps will NOT upload to Sentry; minified stack traces will not be de-mangled. Add the SENTRY_AUTH_TOKEN secret under Settings → Secrets and variables → Actions to enable it."
          fi

      - name: Pull Vercel production environment
        # Fetches the project's settings + production env vars so the
        # client bundle is built with the same VITE_* values as prod
        # (a bare `npm run build` on the runner would NOT have them).
        run: npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build production bundle (Vercel build pipeline)
        run: npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"

      - name: Verify release SHA was inlined into the bundle (A14b-fix-1)
        # Post-build drift check: vite.config.ts inlines
        # process.env.VERCEL_GIT_COMMIT_SHA into the client bundle via the
        # `define` block so the runtime Sentry init can tag events with a
        # release that matches the sourcemap-upload's release tag. If the
        # SHA never makes it into the built JS — because Vercel's `vercel
        # build` ever stops exporting the var, or vite's define resolution
        # changes — Sentry events from this deploy would carry release=""
        # while the uploaded maps live under release=${{ github.sha }},
        # producing minified stack traces in production. Catch that drift
        # here, BEFORE the deploy ships. Non-Sentry deploys (token absent)
        # skip the check — they don't upload maps either, so the
        # invariant doesn't apply.
        run: |
          set -euo pipefail
          if [ -z "${SENTRY_AUTH_TOKEN:-}" ]; then
            echo "SENTRY_AUTH_TOKEN absent — skipping release-SHA inline check (sourcemap upload also skipped)."
            exit 0
          fi
          if [ -z "${VERCEL_GIT_COMMIT_SHA:-}" ]; then
            echo "::error::VERCEL_GIT_COMMIT_SHA is empty in this build environment. The release-tag pin requires it. Check the env block of this workflow."
            exit 1
          fi
          ASSETS_DIR=""
          for d in .vercel/output/static/assets dist/assets; do
            if [ -d "$d" ]; then ASSETS_DIR="$d"; break; fi
          done
          if [ -z "$ASSETS_DIR" ]; then
            echo "::error::Neither .vercel/output/static/assets nor dist/assets exists; cannot verify release SHA inline. Did the build step succeed?"
            exit 1
          fi
          if grep -rq "$VERCEL_GIT_COMMIT_SHA" "$ASSETS_DIR" 2>/dev/null; then
            echo "✅ Release SHA $VERCEL_GIT_COMMIT_SHA found in $ASSETS_DIR — runtime Sentry release tag will match uploaded sourcemaps."
          else
            echo "::error::Release SHA $VERCEL_GIT_COMMIT_SHA NOT found in $ASSETS_DIR. The runtime release tag is not being inlined by vite.config.ts; Sentry events from this deploy will be tagged release='' while uploaded sourcemaps live under release=$VERCEL_GIT_COMMIT_SHA → minified stack traces in production. Fix vite.config.ts's define block or the workflow env block before merging."
            exit 1
          fi

      - name: Deploy prebuilt output to Vercel production
        id: deploy
        run: |
          set -euo pipefail
          URL="$(npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "Deployed to: $URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Write deployment summary
        if: success()
        run: |
          {
            echo "## ✅ Production deployment shipped"
            echo ""
            echo "- **Commit:** \`${{ github.sha }}\`"
            echo "- **Branch:** \`${{ github.ref_name }}\`"
            echo "- **URL:** ${{ steps.deploy.outputs.url }}"
            echo "- **Time:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          } >> "$GITHUB_STEP_SUMMARY"
