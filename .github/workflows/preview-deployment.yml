name: Preview Deployment

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: ['main', 'develop']

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-preview:
    name: Build Preview
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate data files
        run: node scripts/validate-data-files.js

      - name: Run TypeScript checks
        run: npx tsc --noEmit

      - name: Build project
        run: npm run build
        env:
          NODE_ENV: production

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: preview-build
          path: dist/
          retention-days: 7

      - name: Calculate build size
        run: |
          BUILD_SIZE=$(du -sh dist | cut -f1)
          echo "## 📦 Build Information" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Size**: $BUILD_SIZE" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.event.pull_request.head.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.head_ref }}" >> $GITHUB_STEP_SUMMARY

  # No deploy job here: the Vercel-for-GitHub native integration
  # already deploys preview builds. The amondnet/vercel-action@v25 step
  # pulled an outdated CLI (25.1.0) that the Vercel API now rejects (≥47.2.2
  # required), and duplicated work the platform already does.

  pr-comment:
    name: Comment on PR
    runs-on: ubuntu-latest
    needs: build-preview
    if: github.event_name == 'pull_request'
    
    permissions:
      pull-requests: write
    
    steps:
      - name: Comment PR
        uses: actions/github-script@v7
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('🚀 Preview Deployment')
            );
            
            const output = `## 🚀 Preview Deployment
            
            ✅ Build completed successfully!
            
            ### Build Details
            - **Commit**: \`${context.sha.substring(0, 7)}\`
            - **Branch**: \`${context.payload.pull_request.head.ref}\`
            - **Workflow**: [View Run](${context.payload.repository.html_url}/actions/runs/${context.runId})
            
            ### Preview
            Vercel deploys a preview for this PR automatically — see the **Vercel** check on this PR for the live URL.

            ---
            
            *This preview was built from commit ${context.sha.substring(0, 7)}*`;
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: output
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: output
              });
            }
