name: Reliability Burn-in

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      unit_iterations:
        description: "Repeated npm test runs"
        required: true
        default: "5"
      e2e_iterations:
        description: "Repeated Placement V3 E2E runs"
        required: true
        default: "5"
      e2e_pattern:
        description: "Playwright test pattern"
        required: true
        default: "placement-v3-vertical"

jobs:
  reliability-burnin:
    name: Reliability burn-in
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      LOG_DIR: reports/b1-e2e-diagnostics/burnin
      ARTIFACT_DIR: reports/b1-e2e-diagnostics/burnin/artifacts
      VITE_PLACEMENT_TEST_ENABLED: "true"
      VITE_PLACEMENT_V3_UI_ENABLED: "true"
      VITE_SUPABASE_URL: "https://placeholder.invalid.supabase.co"
      VITE_SUPABASE_ANON_KEY: "placeholder-anon-key-not-real"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: B1 branch guard
        run: |
          current_branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          if [ "$current_branch" != "feat/b1-test-stability-burndown" ]; then
            echo "B1 reliability automation must run on feat/b1-test-stability-burndown; current branch is $current_branch"
            exit 1
          fi

      - name: Repeated unit burn-in
        env:
          SUMMARY_JSON: reports/b1-e2e-diagnostics/burnin/repeat-unit-summary.json
          CLUSTER_JSON: reports/b1-e2e-diagnostics/burnin/repeat-unit-flaky-summary.json
          RUN_PREFIX: burnin-unit
        run: scripts/testing/run-repeat-unit.sh "${{ github.event.inputs.unit_iterations || '5' }}"

      - name: Repeated Placement V3 E2E burn-in
        env:
          SUMMARY_JSON: reports/b1-e2e-diagnostics/burnin/repeat-e2e-summary.json
          CLUSTER_JSON: reports/b1-e2e-diagnostics/burnin/repeat-e2e-flaky-summary.json
          RUN_PREFIX: burnin-e2e
        run: scripts/testing/run-repeat-e2e.sh "${{ github.event.inputs.e2e_iterations || '5' }}" "${{ github.event.inputs.e2e_pattern || 'placement-v3-vertical' }}"

      - name: Contention-mode Placement V3 E2E
        env:
          LOG_DIR: reports/b1-e2e-diagnostics/nightly-contention
          ARTIFACT_DIR: reports/b1-e2e-diagnostics/nightly-contention/artifacts
          SUMMARY_JSON: reports/b1-e2e-diagnostics/nightly-contention/e2e-while-unit-summary.json
          CLUSTER_JSON: reports/b1-e2e-diagnostics/nightly-contention/e2e-while-unit-flaky-summary.json
          RUN_PREFIX: nightly-contention-e2e
        run: |
          mkdir -p reports/b1-e2e-diagnostics/nightly-contention/background
          npm test > reports/b1-e2e-diagnostics/nightly-contention/background/npm-test.log 2>&1 &
          unit_pid=$!
          scripts/testing/run-repeat-e2e.sh 2 "${{ github.event.inputs.e2e_pattern || 'placement-v3-vertical' }}"
          wait "$unit_pid"

      - name: Trend summary
        if: always()
        run: npm run placement:b1:trend

      - name: Contention summary
        if: always()
        run: npm run placement:b1:contention

      - name: Retention dry-run
        if: always()
        run: npm run placement:b1:retention -- --dry-run

      - name: Timeout-risk health summary
        if: always()
        run: npm run placement:b1:health

      - name: Flaky-pattern summary
        if: always()
        run: |
          npx tsx scripts/testing/detect-flaky-patterns.ts reports/b1-e2e-diagnostics/burnin --json reports/b1-e2e-diagnostics/burnin/flaky-pattern-summary.json --pretty || true
          if [ -f reports/b1-e2e-diagnostics/burnin/flaky-pattern-summary.json ]; then
            cat reports/b1-e2e-diagnostics/burnin/flaky-pattern-summary.json >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload reliability artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reliability-burnin-artifacts
          path: |
            docs/placement-v3/reliability/
            reports/b1-e2e-diagnostics/
            reports/b1-burnin/
            test-results/
            playwright-smoke-report/
          if-no-files-found: warn
