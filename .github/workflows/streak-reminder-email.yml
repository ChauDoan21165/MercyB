# .github/workflows/streak-reminder-email.yml
#
# Sends streak reminder emails daily at 12:00 UTC (19:00 Vietnam).
# Calls the streak-reminder-email Edge Function.
#
# Secrets (same as weekly-progress-email — already configured):
#   CRON_SECRET, SUPABASE_ANON_KEY, SUPABASE_FUNCTIONS_URL

name: Streak Reminder Email

on:
  # RE-ENABLED 2026-05-18 (A31) — issue #694 resolved. The send now
  # uses the real, non-rotating profiles.email_unsubscribe_token, emits
  # the bilingual compliance footer (buildFooter) + RFC 8058
  # List-Unsubscribe / List-Unsubscribe-Post headers pointing at the
  # email-unsubscribe Edge Function (true one-click), and gates on the
  # per-category profiles.email_streak_reminder_enabled flag. History:
  # DISABLED 2026-05-18 (A9, PR #696) for a broken unsubscribe.
  schedule:
    - cron: "0 12 * * *" # daily 12:00 UTC = 19:00 Vietnam
  workflow_dispatch: # also allow manual trigger

jobs:
  send-streak-emails:
    runs-on: ubuntu-latest
    steps:
      - name: Invoke streak-reminder-email Edge Function
        env:
          FUNCTIONS_URL: ${{ secrets.SUPABASE_FUNCTIONS_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          node -e '
            fetch(process.env.FUNCTIONS_URL + "/streak-reminder-email", {
              method: "POST",
              headers: {
                "Authorization": "Bearer " + process.env.SUPABASE_ANON_KEY,
                "x-cron-secret": process.env.CRON_SECRET,
                "Content-Type": "application/json"
              }
            }).then(async r => {
              const t = await r.text();
              console.log(r.status, t.slice(0, 500));
              if (!r.ok) process.exit(1);
            }).catch(e => { console.error(e); process.exit(1); });
          '
