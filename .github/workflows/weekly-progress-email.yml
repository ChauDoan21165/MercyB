# .github/workflows/weekly-progress-email.yml
#
# Sends weekly learning summary emails every Monday at 01:00 UTC
# (08:00 Vietnam time). Calls the weekly-progress-email Edge Function
# via Supabase Functions invoke.
#
# Requires secrets: CRON_SECRET, SUPABASE_ANON_KEY, SUPABASE_FUNCTIONS_URL.

name: Weekly Progress Email

on:
  # RE-ENABLED 2026-05-18 (A31) — issue #694 resolved. The send now
  # uses the real, non-rotating profiles.email_unsubscribe_token, emits
  # the bilingual compliance footer (buildFooter) + RFC 8058
  # List-Unsubscribe / List-Unsubscribe-Post headers pointing at the
  # email-unsubscribe Edge Function (true one-click), and gates on the
  # per-category profiles.email_weekly_progress_enabled flag. History:
  # DISABLED 2026-05-18 (A9, PR #696) for a broken unsubscribe.
  schedule:
    - cron: "0 1 * * 1" # Monday 01:00 UTC = 08:00 Vietnam
  workflow_dispatch: # also allow manual trigger

jobs:
  send-weekly-emails:
    runs-on: ubuntu-latest
    steps:
      - name: Invoke weekly-progress-email Edge Function
        env:
          FUNCTIONS_URL: ${{ secrets.SUPABASE_FUNCTIONS_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          node -e '
            fetch(process.env.FUNCTIONS_URL + "/weekly-progress-email", {
              method: "POST",
              headers: {
                "Authorization": "Bearer " + process.env.SUPABASE_ANON_KEY,
                "x-cron-secret": process.env.CRON_SECRET,
                "Content-Type": "application/json"
              }
            }).then(async r => {
              const t = await r.text();
              console.log(r.status, t.slice(0, 500));
              if (!r.ok) process.exit(1);
            }).catch(e => { console.error(e); process.exit(1); });
          '
