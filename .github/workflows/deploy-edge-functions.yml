# Deploy Edge Functions
#
# WHY THIS EXISTS
# ---------------
# Fleet-wide edge-function drift audit (2026-05-18) found 0 of ~115
# functions in sync with the repo. Root cause: the only CI deploy
# workflow (the now-removed supabase-functions.yml) hard-coded a deploy
# of a single non-existent function (`mercy_weekly_cron`) and therefore
# FAILED on every push that touched supabase/functions/** — nothing was
# ever actually deployed. This workflow replaces it: every push to main
# that changes a function deploys exactly that function (deploy-changed,
# minimal blast radius), and a manual workflow_dispatch path exists for
# controlled single-function or full-fleet deploys.
#
# FIRST-DEPLOY WARNING (read before merging)
# ------------------------------------------
# This workflow assumes the drift-audit RECONCILIATION PRs are merged
# BEFORE bulk merge-triggered deploys start firing. The ~58 REPO_AHEAD
# functions carry UNDEPLOYED work; the first time each is changed after
# this merges, that accumulated work SHIPS TO USERS. Recommended rollout:
#   1. Merge this PR (workflows do not run on merge of the workflow itself
#      unless the merge commit also touches supabase/functions/**).
#   2. Actions tab -> "Deploy Edge Functions" -> Run workflow ->
#      function_name = a single low-risk function (e.g. health-check) to
#      prove the pipeline end-to-end.
#   3. Only then allow normal merge-triggered deploys.
#
# DELETION POLICY
# ---------------
# This workflow NEVER deletes a function from prod. `--prune` is
# deliberately NOT passed. A function removed from the repo is reported
# as a loud warning only; deleting it from prod is a manual operator
# decision (`supabase functions delete <name> --project-ref ...`).
#
# _shared/ BLIND SPOT (tracked separately)
# ----------------------------------------
# `supabase functions deploy <name>` re-bundles _shared/ at deploy time,
# so a function only picks up _shared changes when the function itself is
# redeployed. A push that ONLY touches supabase/functions/_shared/** (or
# _billing/**) changes zero function dirs and would deploy NOTHING while
# silently drifting every consumer. We do NOT auto-deploy-all on a
# _shared change (dependency analysis is out of scope here) — instead we
# emit a loud warning recommending a manual full deploy. Tracking issue:
# "Detect drift in _shared/ helpers".
#
# NO DOCKER / NO DENO
# -------------------
# `--use-api` bundles functions server-side. Docker is the CLI's default
# bundling method; --use-api avoids it. Deno is the platform runtime, not
# needed in CI for deploy. Adding a Deno/Docker setup step here would be
# dead wiring, so it is intentionally omitted.

name: Deploy Edge Functions

on:
  push:
    branches: ["main"]
    paths:
      - "supabase/functions/**"
  workflow_dispatch:
    inputs:
      function_name:
        description: 'Single function to deploy (e.g. health-check), or "ALL" to deploy every function. Required for manual runs.'
        required: true
        type: string

# Deploys must serialize and never be cancelled mid-flight: a cancelled
# `supabase functions deploy` can leave a function half-updated.
concurrency:
  group: deploy-edge-functions
  cancel-in-progress: false

env:
  # Project ref is public knowledge (it is in CLAUDE.md and every client
  # bundle). Hard-coded so the pipeline does not depend on a
  # SUPABASE_PROJECT_REF secret that does not currently exist.
  SUPABASE_PROJECT_REF: buemdfxyhxunzpgdoqin

jobs:
  deploy:
    name: Deploy changed (or selected) edge functions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (full history — need github.event.before for diff)
        uses: actions/checkout@v4
        with:
          # fetch-depth: 0 so github.event.before is always present even
          # for multi-commit pushes (a shallow clone can miss it and
          # under-deploy).
          fetch-depth: 0

      - name: Precheck — SUPABASE_ACCESS_TOKEN must exist
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error title=Missing secret::SUPABASE_ACCESS_TOKEN is not configured."
            echo "Add it: gh secret set SUPABASE_ACCESS_TOKEN  (token from"
            echo "https://supabase.com/dashboard/account/tokens). Until then NO"
            echo "edge function can deploy and this pipeline fails RED by design."
            exit 1
          fi
          echo "SUPABASE_ACCESS_TOKEN present."

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Determine functions to deploy
        id: select
        run: |
          set -euo pipefail

          FUNCS_DIR="supabase/functions"

          # --- manual dispatch path -------------------------------------
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            INPUT="${{ github.event.inputs.function_name }}"
            if [ "$INPUT" = "ALL" ]; then
              echo "mode=all" >> "$GITHUB_OUTPUT"
              echo "Manual dispatch: deploy ALL functions."
              exit 0
            fi
            if [ ! -d "$FUNCS_DIR/$INPUT" ]; then
              echo "::error title=Unknown function::'$INPUT' is not a directory under $FUNCS_DIR."
              exit 1
            fi
            echo "mode=list" >> "$GITHUB_OUTPUT"
            echo "functions=$INPUT" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch: deploy single function '$INPUT'."
            exit 0
          fi

          # --- push path: diff against previous commit ------------------
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            BEFORE="$(git rev-parse HEAD~1 2>/dev/null || echo '')"
          fi
          if [ -z "$BEFORE" ]; then
            echo "::warning::Cannot resolve previous commit; deploying ALL functions to be safe."
            echo "mode=all" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Diffing $BEFORE..${{ github.sha }}"

          CHANGED="$(git diff --name-only "$BEFORE" "${{ github.sha }}" -- "$FUNCS_DIR" || true)"
          echo "Changed paths under $FUNCS_DIR:"
          echo "$CHANGED" | sed 's/^/  /'

          # _shared / _billing blind spot — loud warning, no auto-deploy-all.
          if echo "$CHANGED" | grep -qE "^$FUNCS_DIR/(_shared|_billing)/"; then
            echo "::warning title=_shared changed::supabase/functions/_shared (or _billing) changed. Consumers do NOT redeploy automatically. Run this workflow manually with function_name=ALL once reconciliation is verified. (Tracking issue: 'Detect drift in _shared/ helpers'.)"
          fi

          # Top-level function dirs that still exist (skip deletions + _ dirs + __tests__).
          DEPLOY_LIST=""
          DELETED_LIST=""
          while IFS= read -r p; do
            [ -z "$p" ] && continue
            name="$(echo "$p" | sed -E "s#^$FUNCS_DIR/##" | cut -d/ -f1)"
            case "$name" in ""|_*|__tests__) continue;; esac
            if [ -d "$FUNCS_DIR/$name" ]; then
              case " $DEPLOY_LIST " in *" $name "*) :;; *) DEPLOY_LIST="$DEPLOY_LIST $name";; esac
            else
              case " $DELETED_LIST " in *" $name "*) :;; *) DELETED_LIST="$DELETED_LIST $name";; esac
            fi
          done <<< "$CHANGED"

          DEPLOY_LIST="$(echo "$DEPLOY_LIST" | xargs || true)"
          DELETED_LIST="$(echo "$DELETED_LIST" | xargs || true)"

          if [ -n "$DELETED_LIST" ]; then
            echo "::warning title=Functions removed from repo::$DELETED_LIST — NOT auto-deleted from prod. Delete manually if intended: supabase functions delete <name> --project-ref $SUPABASE_PROJECT_REF"
          fi

          if [ -z "$DEPLOY_LIST" ]; then
            echo "mode=none" >> "$GITHUB_OUTPUT"
            echo "No deployable function directories changed."
            exit 0
          fi
          echo "mode=list" >> "$GITHUB_OUTPUT"
          echo "functions=$DEPLOY_LIST" >> "$GITHUB_OUTPUT"
          echo "Will deploy: $DEPLOY_LIST"

      - name: Deploy
        if: steps.select.outputs.mode != 'none'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          MODE="${{ steps.select.outputs.mode }}"

          if [ "$MODE" = "all" ]; then
            echo "Deploying ALL functions (config.toml verify_jwt respected)..."
            supabase functions deploy \
              --project-ref "$SUPABASE_PROJECT_REF" --use-api
            echo "All functions deployed."
            exit 0
          fi

          # mode=list — deploy each; attempt all, fail RED if any failed.
          FAILED=""
          for fn in ${{ steps.select.outputs.functions }}; do
            echo "::group::Deploy $fn"
            if supabase functions deploy "$fn" \
                 --project-ref "$SUPABASE_PROJECT_REF" --use-api; then
              echo "OK: $fn"
            else
              echo "::error title=Deploy failed::$fn"
              FAILED="$FAILED $fn"
            fi
            echo "::endgroup::"
          done

          if [ -n "$FAILED" ]; then
            echo "::error title=Deploy failures::Failed:$FAILED"
            exit 1
          fi
          echo "Deploy complete."
