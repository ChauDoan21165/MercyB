name: Weekly Audio Byte Sweep

# Operationalizes PRINCIPLE 9 (status docs drift — re-audit weekly). The
# changed-rooms gate in validate.yml only proves rooms touched by a PR; this
# sweeps the ENTIRE corpus against the public room-audio bucket so a clip that
# silently rots in storage (bucket-side regression, never touched in a PR) is
# caught within a week instead of by a user. Would have caught all 317 defects
# in RECON-audio-byte-full-audit.md. Deliberately NOT in the Vercel build path
# (~2,920 network HEADs per deploy is the wrong place).

on:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write           # open a tracking issue on failure

jobs:
  audio-byte-sweep:
    name: Full-corpus audio byte sweep
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Full-corpus audio byte sweep
        run: node scripts/check-room-audio-bytes.mjs

      - name: Open tracking issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Weekly audio byte sweep failed — bucket defects detected ($(date -u +%Y-%m-%d))" \
            --label "audio,ci" \
            --body "The weekly full-corpus audio byte sweep found room-JSON-referenced audio that is missing, 0-byte, 67-byte, or non-audio in the public room-audio bucket.

          Run log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Fix with \`npx tsx scripts/regen-audio-defects.ts\` (extend the allowlist in scripts/audio-regen-manifest.json with the failing keys). See reports/RECON-audio-byte-full-audit.md." \
            || echo "issue creation skipped (likely a duplicate or perms) — the red run is the signal"
