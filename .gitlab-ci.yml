# Draft GitLab CI conversion from .github/workflows/*.yml.
# Local-only draft: no deploy/push side effects are enabled by default.
# Configure GitLab CI/CD variables before enabling remote checks/deploys:
# - VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_KEY, VITE_SUPABASE_ANON_KEY
# - SUPABASE_SERVICE_ROLE_KEY, SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF
# - VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
# - CODECOV_TOKEN, SENTRY_AUTH_TOKEN if those integrations are restored

image: node:22-bookworm

stages:
  - prepare
  - validate
  - typecheck
  - lint
  - test
  - build
  - optional
  - deploy

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  NODE_ENV: "test"
  SUPABASE_PROJECT_REF: "buemdfxyhxunzpgdoqin"

default:
  interruptible: true
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - node --version
    - npm --version
    - npm ci --legacy-peer-deps --cache .npm --prefer-offline

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_PIPELINE_SOURCE == "web"'

package_lock:
  stage: prepare
  before_script: []
  script:
    - test -f package-lock.json
    - npm install --package-lock-only --ignore-scripts --legacy-peer-deps
    - git diff --exit-code -- package-lock.json

validate_data_files:
  stage: validate
  script:
    - node scripts/validate-data-files.js

validate_json_strict:
  stage: validate
  variables:
    VITE_MB_VALIDATION_MODE: "strict"
  script:
    # Mirrors .github/workflows/validate-json.yml.
    - node scripts/validate-rooms-ci.js
    - node scripts/validate-room-links.cjs

validate_rooms:
  stage: validate
  script:
    - npm run validate-rooms

validate_room_registry:
  stage: validate
  script:
    - node scripts/validate-room-registry.js
    - node scripts/generate-room-registry.mjs
    - |
      if [ -n "$(git status --porcelain src/lib/roomManifest.ts src/lib/roomDataImports.ts)" ]; then
        echo "Registry files are out of sync. Run node scripts/generate-room-registry.mjs locally and commit the result."
        git diff src/lib/roomManifest.ts src/lib/roomDataImports.ts
        exit 1
      fi

audio_manifest_check:
  stage: validate
  script:
    # GitHub auto-committed public/audio changes; GitLab draft only fails
    # on drift so maintainers can review the generated diff.
    - npm run generate:audio-manifest
    - git diff --exit-code -- public/audio

validate_room_json_and_audio:
  stage: validate
  variables:
    GIT_DEPTH: "0"
  script:
    - node scripts/validate-manifest.js
    - node scripts/validate-audio.js
    # Requires a merge-base/fetch-depth equivalent. GitLab clones are usually
    # shallow; set GIT_DEPTH=0 if check-room-audio-bytes --changed cannot find
    # the target branch locally.
    - node scripts/check-room-audio-bytes.mjs --changed
    - npx tsx src/lib/scripts/validateRoomData.ts

delete_account_coverage:
  stage: validate
  script:
    # Script skips when Supabase variables are absent; configure
    # VITE_SUPABASE_URL + SUPABASE_SERVICE_ROLE_KEY for the full gate.
    - node scripts/check-delete-account-coverage.mjs

typecheck_app:
  stage: typecheck
  script:
    - npx tsc --noEmit

typecheck_functions:
  stage: typecheck
  script:
    - npm run typecheck:functions

deno_edge_function_check:
  stage: typecheck
  before_script:
    - node --version
    - npm --version
    - npm ci --legacy-peer-deps --cache .npm --prefer-offline
    - curl -fsSL https://deno.land/install.sh | sh
    - export DENO_INSTALL="$HOME/.deno"
    - export PATH="$DENO_INSTALL/bin:$PATH"
    - deno --version
  script:
    - export DENO_INSTALL="$HOME/.deno"
    - export PATH="$DENO_INSTALL/bin:$PATH"
    - npm run deno:check:functions

lint_code:
  stage: lint
  script:
    - npm run lint

console_log_scan:
  stage: lint
  allow_failure: true
  script:
    - |
      if grep -r "console.log" src/ --exclude-dir=node_modules; then
        echo "Warning: console.log statements found"
      fi

module_boundaries:
  stage: lint
  script:
    - npm run depcruise:validate
    - npm run depcruise:metrics || true

vitest:
  stage: test
  script:
    - npm test

vitest_coverage:
  stage: test
  script:
    - npx vitest run --coverage
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - coverage/
  allow_failure: true

build_project:
  stage: build
  variables:
    NODE_ENV: "production"
  script:
    - npm run build
    - node scripts/check-bundle-budget.mjs
  artifacts:
    expire_in: 7 days
    paths:
      - dist/

preview_build:
  stage: build
  variables:
    NODE_ENV: "production"
  script:
    - node scripts/validate-data-files.js
    - npx tsc --noEmit
    - npm run build
    - du -sh dist
  artifacts:
    expire_in: 7 days
    paths:
      - dist/
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

playwright_smoke:
  stage: optional
  script:
    - npx playwright install --with-deps
    - npm run test:e2e
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - playwright-report/
      - test-results/
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'

roommaster_validation:
  stage: optional
  script:
    - node scripts/roommaster-validate.js
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - roommaster-report.json
  allow_failure: true

validate_deployed_edge_functions:
  stage: optional
  script:
    # Requires VITE_SUPABASE_URL plus one anon/publishable key variable.
    # GitHub used expression fallback; GitLab needs explicit variable names.
    - export VITE_SUPABASE_ANON_KEY="${VITE_SUPABASE_ANON_KEY:-${SUPABASE_ANON_KEY:-${VITE_SUPABASE_PUBLISHABLE_KEY:-}}}"
    - npx tsx scripts/validate-edge-functions.ts
  allow_failure: true
  rules:
    - if: '$VITE_SUPABASE_URL && ($VITE_SUPABASE_ANON_KEY || $SUPABASE_ANON_KEY || $VITE_SUPABASE_PUBLISHABLE_KEY)'
    - when: manual

check_edge_function_drift:
  stage: optional
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends unzip ca-certificates
    - curl -fsSL https://github.com/supabase/cli/releases/latest/download/supabase_linux_amd64.tar.gz | tar -xz -C /usr/local/bin supabase
    - supabase --version
  script:
    # GitHub workflow comments on PRs; this draft only fails/reports in logs.
    # Requires SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF.
    - test -n "${SUPABASE_ACCESS_TOKEN:-}"
    - echo "Edge-function drift check needs the GitHub shell logic ported or a repo script wrapper before enforcing."
  allow_failure: true
  rules:
    - if: '$SUPABASE_ACCESS_TOKEN'
      when: manual
    - when: manual

vercel_preview_placeholder:
  stage: optional
  script:
    - echo "GitHub used Vercel-for-GitHub native previews and PR comments."
    - echo "In GitLab, enable a Vercel GitLab integration or add VERCEL_TOKEN/VERCEL_ORG_ID/VERCEL_PROJECT_ID and a manual deploy job."
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual

production_deploy_vercel:
  stage: deploy
  variables:
    NODE_ENV: "production"
  script:
    # Manual only. Requires VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID.
    # SENTRY_AUTH_TOKEN is optional but needed for sourcemap upload parity.
    - test -n "${VERCEL_TOKEN:-}"
    - test -n "${VERCEL_ORG_ID:-}"
    - test -n "${VERCEL_PROJECT_ID:-}"
    - npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
    - npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"
    - npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $VERCEL_TOKEN && $VERCEL_ORG_ID && $VERCEL_PROJECT_ID'
      when: manual
    - when: never

supabase_migrations_staging:
  stage: deploy
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends unzip ca-certificates
    - curl -fsSL https://github.com/supabase/cli/releases/latest/download/supabase_linux_amd64.tar.gz | tar -xz -C /usr/local/bin supabase
    - supabase --version
  script:
    # Requires SUPABASE_ACCESS_TOKEN, SUPABASE_STAGING_PROJECT_REF,
    # and SUPABASE_STAGING_DB_PASSWORD.
    - supabase login --token "$SUPABASE_ACCESS_TOKEN"
    - supabase link --project-ref "$SUPABASE_STAGING_PROJECT_REF"
    - supabase db push
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $SUPABASE_ACCESS_TOKEN && $SUPABASE_STAGING_PROJECT_REF && $SUPABASE_STAGING_DB_PASSWORD'
      changes:
        - supabase/migrations/**/*
        - supabase/config.toml
      when: manual
    - when: never

supabase_migrations_prod:
  stage: deploy
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends unzip ca-certificates
    - curl -fsSL https://github.com/supabase/cli/releases/latest/download/supabase_linux_amd64.tar.gz | tar -xz -C /usr/local/bin supabase
    - supabase --version
  script:
    # Requires SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF, and SUPABASE_DB_PASSWORD.
    - supabase login --token "$SUPABASE_ACCESS_TOKEN"
    - supabase link --project-ref "$SUPABASE_PROJECT_REF"
    - supabase db push
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $SUPABASE_ACCESS_TOKEN && $SUPABASE_PROJECT_REF && $SUPABASE_DB_PASSWORD'
      changes:
        - supabase/migrations/**/*
        - supabase/config.toml
      when: manual
    - when: never

supabase_edge_functions_deploy:
  stage: deploy
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends unzip ca-certificates
    - curl -fsSL https://github.com/supabase/cli/releases/latest/download/supabase_linux_amd64.tar.gz | tar -xz -C /usr/local/bin supabase
    - supabase --version
  script:
    # Manual only. Requires SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF.
    # Set EDGE_FUNCTION_NAME to one function name, or leave it empty to deploy all
    # repo functions. This intentionally does not delete removed functions.
    - test -n "${SUPABASE_ACCESS_TOKEN:-}"
    - test -n "${SUPABASE_PROJECT_REF:-}"
    - |
      if [ -n "${EDGE_FUNCTION_NAME:-}" ]; then
        supabase functions deploy "$EDGE_FUNCTION_NAME" --project-ref "$SUPABASE_PROJECT_REF" --use-api
      else
        for fn_dir in supabase/functions/*; do
          [ -d "$fn_dir" ] || continue
          fn="$(basename "$fn_dir")"
          case "$fn" in
            _shared|_billing) continue ;;
          esac
          supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF" --use-api
        done
      fi
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $SUPABASE_ACCESS_TOKEN && $SUPABASE_PROJECT_REF'
      changes:
        - supabase/functions/**/*
      when: manual
    - when: never
