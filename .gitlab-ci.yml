.manual_shared_fallback: &manual_shared_fallback
  allow_failure: false

.build_script: &build_script
  - npx tsc --noEmit
  - npm run typecheck:functions
  # node:24-bookworm-slim ships without curl, the CA bundle, unzip, or
  # git. We need them for:
  #   - curl + ca-certificates: HTTPS fetch of the Deno install
  #     script and cert-chain validation (deno.land).
  #   - unzip: the Deno installer unpacks a .zip release ("Error:
  #     either unzip or 7z is required to install Deno" otherwise).
  #   - git: scripts/check-no-raw-react-lazy.mjs uses `git ls-files`
  #     as its fast path. Without git on PATH, the script falls back
  #     to a recursive walk() that has a latent `require()`-in-ESM
  #     bug — fixing the bug is out of scope for this CI port MR, so
  #     we keep the fast path live by installing git here. Other
  #     build-job steps that touch git (`git status --porcelain`,
  #     `git diff` in the registry-drift check) need it too.
  # `--no-install-recommends` keeps image bloat minimal; all four
  # packages are tiny. Only the `build` job needs Deno + the
  # registry-drift check, so the install scope is intentionally
  # limited here rather than hoisted into a shared anchor.
  - |
    case "$(uname -s)" in
      Darwin)
        command -v curl
        command -v unzip
        command -v git
        ;;
      Linux)
        apt-get update && apt-get install -y --no-install-recommends curl ca-certificates unzip git
        ;;
      *)
        echo "Unsupported CI OS: $(uname -s)" >&2
        exit 1
        ;;
    esac
  # Deno toolchain install for the edge-function check. The official
  # install.sh fetches the latest stable Deno when invoked without a
  # version arg. The repo's deno.lock is v5 → needs Deno >= 2.2; any
  # stable 2.x or later satisfies that. Important: do NOT pass
  # `v2.x` here. That works for the GitHub setup-deno action (which
  # does semver-range resolution) but install.sh interprets the arg
  # as a literal release tag and 404s on a non-existent `v2.x` tag.
  # If pinning becomes necessary, use a concrete release like
  # `v2.4.0`. On Linux/Docker, DENO_INSTALL=/usr/local preserves the
  # historical CI path. On macOS shell runners, install into the user's
  # writable home directory instead of /usr/local.
  - |
    if command -v deno >/dev/null 2>&1; then
      echo "Using existing Deno: $(command -v deno)"
    else
      case "$(uname -s)" in
        Darwin)
          export DENO_INSTALL="$HOME/.deno"
          ;;
        Linux)
          export DENO_INSTALL="/usr/local"
          ;;
        *)
          echo "Unsupported CI OS: $(uname -s)" >&2
          exit 1
          ;;
      esac
      curl -fsSL https://deno.land/install.sh | sh
    fi
  - export PATH="$HOME/.deno/bin:/usr/local/bin:$PATH"
  - command -v deno
  - npm run deno:check:functions
  - npm run build
  - node scripts/check-bundle-budget.mjs
  - node scripts/validate-data-files.js
  - node scripts/validate-room-registry.js
  - node scripts/validate-kids-rooms.js
  # check-delete-account-coverage exits 0 (skip) when Supabase env
  # vars are absent — safe to call unconditionally. When the CI/CD
  # variables VITE_SUPABASE_URL + SUPABASE_SERVICE_ROLE_KEY are set
  # in GitLab project settings, the check fires for real.
  - node scripts/check-delete-account-coverage.mjs
  # Generate the room registry and fail if the on-disk version drifts
  # from what generation produces — mirrors the GitHub workflow's
  # "Generate and verify room registry" step.
  - echo "🔄 Generating room registry..."
  - node scripts/generate-room-registry.mjs
  - 'if [ -n "$(git status --porcelain src/lib/roomManifest.ts src/lib/roomDataImports.ts)" ]; then echo "❌ Registry files are out of sync — run scripts/generate-room-registry.mjs locally and commit."; git diff src/lib/roomManifest.ts src/lib/roomDataImports.ts; exit 1; fi'
  - echo "✅ Registry files are in sync"
  # NB: the Vitest suite no longer runs in `build`. It moved to the
  # sharded `test` jobs below (`npx vitest run --shard …`). `build` is
  # now typecheck + bundle build + data/registry validators only.

.lint_script: &lint_script
  - npm run lint
  - 'grep -r "console.log" src/ --exclude-dir=node_modules || true'

.validate_rooms_script: &validate_rooms_script
  - npm run validate-rooms

.module_boundaries_script: &module_boundaries_script
  - npm run depcruise:validate
  # `|| true` mirrors the GitHub workflow's `if: always()` + `|| true`.
  - npm run depcruise:metrics || true
  # Dead-code reaccumulation tripwire — INFO-LEVEL, never fails the pipeline.
  # Reports files that became orphans (no in/out edges) so a reviewer catches
  # them on the introducing PR. Full tiered inventory + false-positive classes:
  # docs/dead-code-risk-map.md. The `|| true` is belt-and-suspenders; the scan's
  # rules are severity:warn so depcruise already exits 0.
  - npm run depcruise:orphans || true

.test_shard_script: &test_shard_script
  # `node:24-bookworm-slim` ships without git. A few suites spawn it to
  # build throwaway repos — scripts/__tests__/audit-local-artifacts and
  # scripts/__tests__/check-manifest-delta both `git init`. When tests
  # ran inside the `build` job they inherited that job's apt-installed
  # git; the extracted shards must install it too or those suites fail
  # with `spawnSync git ENOENT` (whichever shard the files land in).
  # Only git is needed — curl/unzip/deno were build-only, not test deps.
  # `--no-install-recommends` keeps the install lean.
  - |
    case "$(uname -s)" in
      Darwin)
        command -v git
        ;;
      Linux)
        apt-get update && apt-get install -y --no-install-recommends git
        ;;
      *)
        echo "Unsupported CI OS: $(uname -s)" >&2
        exit 1
        ;;
    esac
  # [B3-CPU-PROBE] Behavior-neutral diagnostic (no test behavior change).
  # Captures the core count the macOS shell runner actually exposes and the
  # number vitest's threads pool sizes itself to (os.cpus().length), plus
  # runner/concurrency identity — so a worker cap (--maxWorkers) can be sized
  # to avoid oversubscription when two shards run concurrently on one Mac.
  # Remove once the cap is sized and landed. Never fails the job.
  - |
    echo "[B3-CPU-PROBE] uname=$(uname -s) node=$(node -v)"
    echo "[B3-CPU-PROBE] node_os_cpus=$(node -p 'os.cpus().length' 2>/dev/null)"
    command -v nproc  >/dev/null 2>&1 && echo "[B3-CPU-PROBE] nproc=$(nproc)" || true
    command -v sysctl >/dev/null 2>&1 && echo "[B3-CPU-PROBE] hw.logicalcpu=$(sysctl -n hw.logicalcpu 2>/dev/null) hw.physicalcpu=$(sysctl -n hw.physicalcpu 2>/dev/null) hw.ncpu=$(sysctl -n hw.ncpu 2>/dev/null)" || true
    echo "[B3-CPU-PROBE] CI_NODE_INDEX=$CI_NODE_INDEX CI_NODE_TOTAL=$CI_NODE_TOTAL CI_CONCURRENT_ID=$CI_CONCURRENT_ID runner=$CI_RUNNER_DESCRIPTION tags=$CI_RUNNER_TAGS"
  - npx vitest run --shard=$CI_NODE_INDEX/$CI_NODE_TOTAL

.ai_tutor_quality_gate_script: &ai_tutor_quality_gate_script
  - npm run test:ai-tutor-golden-flow

.native_audio_smoke_script: &native_audio_smoke_script
  - node -v
  - |
    node -e 'const major = Number(process.versions.node.split(".")[0]); if (![22, 24].includes(major)) { console.error(`native-audio-smoke requires Node 22 or 24, got ${process.version}`); process.exit(1); }'
  - npm run build
  - npm run cap:sync:ios
  - npm run cap:sync:android
  - |
    if [ -n "${CI_MERGE_REQUEST_DIFF_BASE_SHA:-}" ]; then
      git fetch --depth 1 origin "+${CI_MERGE_REQUEST_DIFF_BASE_SHA}:refs/remotes/origin/mobile-audio-base"
      MOBILE_AUDIO_VERIFY_BASE="origin/mobile-audio-base"
    else
      git fetch --depth 1 origin +main:refs/remotes/origin/main
      MOBILE_AUDIO_VERIFY_BASE="origin/main"
    fi
  - npm run verify:mobile-audio -- --base "$MOBILE_AUDIO_VERIFY_BASE"

.playwright_perf_budget_script: &playwright_perf_budget_script
  - |
    case "$(uname -s)" in
      Darwin)
        npx playwright install chromium
        ;;
      Linux)
        npx playwright install --with-deps chromium
        ;;
      *)
        echo "Unsupported CI OS: $(uname -s)" >&2
        exit 1
        ;;
    esac
  - npm run test:perf-budgets

# ── `test` stage jobs ──────────────────────────────────────────────────

# `build` — typecheck + edge-fn typecheck + Deno check + bundle build +
# data/registry validators. The Vitest suite used to run here as a final
# `npm test` step; it now runs in the sharded `test` jobs below. The
# post-migration doc-drift detector
# (`tests/docs/post-migration-doc-drift.test.ts`) still runs because
# vitest discovers it under its default `tests/**` glob in those jobs.
#
# Mirrors GitHub's `build` job (minus the test step). Each line
# corresponds to a step there.
build:
  <<: [*node_job, *local_runner, *app_test_rules]
  stage: test
  script: *build_script

build:shared-fallback:
  <<: [*node_job, *manual_shared_fallback, *manual_shared_app_rules]
  stage: test
  script: *build_script

# `test` — Vitest suite, sharded across N parallel job instances.
# Extracted from the old monolithic `npm test` step that closed the
# `build` job. Vitest's native `--shard i/n` partitions test *files*
# across instances; GitLab's `parallel: 2` spawns two job copies and
# sets CI_NODE_INDEX (1..2) and CI_NODE_TOTAL (2). Each shard reports its
# own status and the pipeline passes only if BOTH shards pass.
#
# Profiled at 589 files / ~10173 tests: 2 shards split 295/294 files
# (~42s and ~49s, vs ~85s monolithic). On the `concurrent = 1` local
# runner the two shards still run serially, so today's wall-clock is
# roughly neutral (and pays one extra cached `npm ci`). The win is
# automatic the moment runner concurrency is raised or jobs route to
# cloud runners — bump `parallel` and the shards fan out to a ~2-4x
# speedup with no further repo change. Sharding by file means a flaky
# order-dependent test could surface differently than in the monolithic
# run; none were found (the union of `--shard 1/2` + `--shard 2/2`
# equals the monolithic run exactly — 589 files / 10173 tests, all
# green).
#
# Tests run against `src/` via vitest's own transform, so they do NOT
# need `npm run build` output and run independently of the `build` job.
# Cache CONSUMER (pull-only): shards share the node_modules cache the
# `build` producer seeds and never re-archive it. See `.npm_cache_def`.
test:
  <<: [*node_job, *local_runner, *app_test_rules]
  stage: test
  parallel: 2
  cache:
    <<: *npm_cache_def
    policy: pull
  script: *test_shard_script

test:shared-fallback:
  <<: [*node_job, *manual_shared_fallback, *manual_shared_app_rules]
  stage: test
  parallel: 2
  script: *test_shard_script

ai-tutor-quality-gate:
  <<: [*node_job, *local_runner, *ai_tutor_golden_flow_rules]
  stage: test
  cache:
    <<: *npm_cache_def
    policy: pull
  script: *ai_tutor_quality_gate_script

ai-tutor-quality-gate:shared-fallback:
  <<: [*node_job, *manual_shared_fallback, *manual_shared_ai_tutor_golden_flow_rules]
  stage: test
  script: *ai_tutor_quality_gate_script

native-audio-smoke:
  <<: [*node_job, *local_runner]
  stage: test
  allow_failure: true
  cache:
    <<: *npm_cache_def
    policy: pull
  rules:
    - if: '$MERCYB_SHARED_RUNNER_FALLBACK == "1"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^release(\/|$)/)'
      changes: *native_audio_smoke_changes
  script: *native_audio_smoke_script

playwright-perf-budgets:
  <<: [*node_job, *local_runner, *app_test_rules]
  stage: test
  cache:
    <<: *npm_cache_def
    policy: pull
  script: *playwright_perf_budget_script

playwright-perf-budgets:shared-fallback:
  <<: [*node_job, *manual_shared_fallback, *manual_shared_app_rules]
  stage: test
  script: *playwright_perf_budget_script

delete-account-guard:
  <<: [*node_job, *local_runner]
  stage: test
  cache:
    <<: *npm_cache_def
    policy: pull
  rules:
    - if: '$MERCYB_SHARED_RUNNER_FALLBACK == "1"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH =~ /^release(\/|$)/)'
  script:
    - npm run check:delete-account-guard

delete-account-guard:shared-fallback:
  <<: [*node_job, *manual_shared_fallback]
  stage: test
  rules:
    - if: '$MERCYB_SHARED_RUNNER_FALLBACK == "1" && $CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
    - if: '$MERCYB_SHARED_RUNNER_FALLBACK == "1" && $CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH =~ /^release(\/|$)/)'
      when: manual
  script:
    - npm run check:delete-account-guard

delete-account-live:
  <<: [*node_job, *local_runner]
  stage: test
  allow_failure: true
  rules:
    - if: '$MERCYB_DELETE_ACCOUNT_LIVE_GUARD == "1" && $CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH =~ /^release(\/|$)/)'
      when: manual
    - if: '$MERCYB_DELETE_ACCOUNT_LIVE_GUARD == "1" && $CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^release(\/|$)/)'
      changes:
        - scripts/check-delete-account-live.mjs
        - scripts/check-delete-account-coverage.mjs
        - supabase/functions/delete-account/**/*
        - .gitlab-ci.yml
      when: manual
  script:
    - node scripts/check-delete-account-live.mjs

# `lint` — eslint + a soft console.log warning (does not fail the job,
# same as GitHub's `continue-on-error: true`).
lint:
  <<: [*node_job, *local_runner, *lint_test_rules]
  stage: test
  # Cache consumer: pull only, never re-archive node_modules. See
  # `.npm_cache_def`.
  cache:
    <<: *npm_cache_def
    policy: pull
  script: *lint_script

lint:shared-fallback:
  <<: [*node_job, *manual_shared_fallback, *manual_shared_lint_rules]
  stage: test
  script: *lint_script

# `validate-rooms` — the full room-content validator. Heavier than the
# build-stage validate-room-registry / validate-kids-rooms steps; runs
# in its own job so a content-only break does not also stall the build.
validate-rooms:
  <<: [*node_job, *local_runner, *room_test_rules]
  stage: test
  # Cache consumer: pull only, never re-archive node_modules. See
  # `.npm_cache_def`.
  cache:
    <<: *npm_cache_def
    policy: pull
  script: *validate_rooms_script

validate-rooms:shared-fallback:
  <<: [*node_job, *manual_shared_fallback, *manual_shared_room_rules]
  stage: test
  script: *validate_rooms_script

# `module-boundaries` — dependency-cruiser validation. Per the GitHub
# workflow's note, errors are real violations; the metrics pass is
# informational and never fails.
module-boundaries:
  <<: [*node_job, *local_runner, *module_test_rules]
  stage: test
  # Cache consumer: pull only, never re-archive node_modules. See
  # `.npm_cache_def`.
  cache:
    <<: *npm_cache_def
    policy: pull
  script: *module_boundaries_script

module-boundaries:shared-fallback:
  <<: [*node_job, *manual_shared_fallback, *manual_shared_module_rules]
  stage: test
  script: *module_boundaries_script

# `check-new-orphans` — preventive, diff-scoped dead-code guard. Fails an MR
# that *introduces* a new orphan file (a src module nothing imports) or a new
# unused export, but never on the pre-existing backlog. Pure git + node: no
# npm ci, no module-graph build, no cache — just git (which the slim image
# lacks, so we apt-install it like the build job does). Typically ~2s of work.
#
# Runs on EVERY merge request (any target), not main-only — the point is to
# catch dead code at the PR that adds it. GIT_DEPTH 0 so the MR merge-base
# always resolves; the script fail-opens if it somehow cannot. See
# scripts/ci/check-new-orphans.mjs for the detection rules and FP guards.
.orphan_guard_script: &orphan_guard_script
  - |
    case "$(uname -s)" in
      Darwin)
        command -v git
        ;;
      Linux)
        apt-get update && apt-get install -y --no-install-recommends git
        ;;
      *)
        echo "Unsupported CI OS: $(uname -s)" >&2
        exit 1
        ;;
    esac
  - node scripts/ci/check-new-orphans.mjs

.orphan_guard_mr_rules: &orphan_guard_mr_rules
  rules:
    - if: '$MERCYB_SHARED_RUNNER_FALLBACK == "1"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

check-new-orphans:
  <<: [*local_runner, *orphan_guard_mr_rules]
  image: node:24-bookworm-slim
  interruptible: true
  stage: test
  variables:
    # Full history so `git merge-base` against the MR target resolves even on
    # branches that diverged past the default shallow GIT_DEPTH.
    GIT_DEPTH: "0"
  cache: {}
  script: *orphan_guard_script

check-new-orphans:shared-fallback:
  image: node:24-bookworm-slim
  interruptible: true
  stage: test
  rules:
    - if: '$MERCYB_SHARED_RUNNER_FALLBACK == "1" && $CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
  variables:
    GIT_DEPTH: "0"
  cache: {}
  script: *orphan_guard_script

ci-job-tags-guard:
  <<: [*local_runner]
  image: node:24-bookworm-slim
  interruptible: true
  stage: test
  cache: {}
  rules:
    - if: '$MERCYB_SHARED_RUNNER_FALLBACK == "1"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH =~ /^release(\/|$)/)'
  script:
    - node scripts/ci/check-job-tags.mjs

post-merge-worktree-reaper:
  <<: [*local_runner]
  interruptible: true
  stage: test
  tags:
    - local
    - mac
    - mercyb
    - isolated-builds
    - post-merge-reaper
  variables:
    GIT_DEPTH: "0"
  cache: {}
  rules:
    - if: '$MERCYB_SHARED_RUNNER_FALLBACK == "1"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
  script:
    - |
      set -euo pipefail
      REAPER_REPO="${MERCYB_REAPER_REPO:-}"
      if [ -z "$REAPER_REPO" ]; then
        for candidate in "${CI_PROJECT_DIR:-}" "$HOME/MercyB" /Users/admin/MercyB /Users/chaudoanm3/MercyB; do
          [ -n "$candidate" ] || continue
          if git -C "$candidate" rev-parse --git-dir >/dev/null 2>&1; then
            REAPER_REPO="$candidate"
            break
          fi
        done
      fi
      if [ -z "$REAPER_REPO" ]; then
        echo "[post-merge-worktree-reaper] no canonical local repo found; falling back to CI_BUILDS_DIR cleanup only"
        REAPER_REPO="$PWD"
      fi
      echo "[post-merge-worktree-reaper] resolved repo=$REAPER_REPO"
      git -C "$REAPER_REPO" fetch origin main --prune
      scripts/supervisor/post-merge-worktree-reaper.sh --live --repo "$REAPER_REPO" --merged-ref origin/main --roots "${MERCYB_REAPER_WORKTREE_ROOTS:-/private/tmp}" --builds-dir "${MERCYB_REAPER_BUILDS_DIR:-${CI_BUILDS_DIR:-}}" --reason "main-push pipeline ${CI_PIPELINE_ID:-unknown}"

# ── Manual production frontend deploy ─────────────────────────────────

deploy-netlify-publish-only:
  <<: [*node_job, *local_runner]
  stage: deploy
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
    - when: never
  script:
    - npm run build
    - |
      if grep -rq "placeholder.invalid" dist/assets/*.js; then
        echo "ABORT: placeholder.invalid found in built JS assets"
        exit 2
      fi
    - |
      SITE_INFO_FILE="$(mktemp)"
      npx --yes netlify-cli api getSite --data "{\"site_id\":\"$NETLIFY_SITE_ID\"}" --auth "$NETLIFY_AUTH_TOKEN" > "$SITE_INFO_FILE"
      LOCKED_DEPLOY_ID="$(
        node -e '
          const fs = require("node:fs");
          const site = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
          const deploy = site.published_deploy || {};
          process.stdout.write(deploy.locked && deploy.id ? deploy.id : "");
        ' "$SITE_INFO_FILE"
      )"
      rm -f "$SITE_INFO_FILE"
      if [ -n "$LOCKED_DEPLOY_ID" ]; then
        echo "Unlocking locked Netlify production deploy before manual publish."
        npx --yes netlify-cli api unlockDeploy --data "{\"deploy_id\":\"$LOCKED_DEPLOY_ID\"}" --auth "$NETLIFY_AUTH_TOKEN" >/dev/null
      fi
    - npx --yes netlify-cli deploy --prod --dir=dist --functions=netlify/functions --no-build --skip-functions-cache --site "$NETLIFY_SITE_ID" --auth "$NETLIFY_AUTH_TOKEN"

# ── Manual Cloudflare Pages production deploy (DORMANT — not enabled) ───
#
# Removes the `npx wrangler` toil while KEEPING the human gate Chau set after
# two unreviewed deploys reached prod. This job is intentionally dormant:
#
#   • `when: manual` — it NEVER auto-deploys on push. Auto-deploy on every main
#     push would reverse the manual-deploy lock; full no-click auto-publish is a
#     Chau-only decision and is deliberately NOT enabled here.
#   • Gated behind `MERCYB_CF_DEPLOY_ENABLED == "1"` — until Chau sets that
#     CI/CD variable the job does not even appear in the pipeline, so merging
#     this MR does NOT enable deploys.
#   • Production branch push only (`main`), never merge-request pipelines, and
#     no preview deploys.
#
# Before enabling (Chau), ALL of these must hold:
#   1. The supply-chain verdict is in — enabling puts the CF token on the runner.
#   2. MR !580 (the functions/ Pages layout) is merged to main and correct.
#   3. Create two PROTECTED + MASKED CI/CD variables:
#        CLOUDFLARE_API_TOKEN   — scope to **Pages:Edit on the `mercyblade`
#                                 project ONLY**, not account-wide.
#        CLOUDFLARE_ACCOUNT_ID
#   4. Set `MERCYB_CF_DEPLOY_ENABLED=1` to surface the manual job, then click it.
deploy-cloudflare-pages:
  <<: [*node_job, *local_runner]
  stage: deploy
  variables:
    # This job holds CLOUDFLARE_API_TOKEN when enabled. Keep install
    # lifecycle scripts disabled so package postinstalls cannot run with it.
    NPM_CI_EXTRA_FLAGS: "--ignore-scripts"
  rules:
    - if: '$MERCYB_CF_DEPLOY_ENABLED == "1" && $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
      when: manual
    - when: never
  script:
    - bash scripts/deploy-cloudflare-pages-main.sh

# ── `verify` stage: post-deploy production golden flows (MANDATORY) ────
#
# Runs the production golden-flow smoke against the LIVE site. Every main
# merge auto-publishes via the Netlify webhook, so a main-push pipeline IS
# a post-deploy moment. This is the runtime gate behind the 2026-06-10
# placeholder.invalid incident: the build-time env guard catches a bad
# *build*, the pre-publish dist scan catches a bad *artifact*, and this
# catches a bad *deploy* — a stale/wrong bundle served, an unreachable
# auth backend, silently-degraded TTS, or a bypassed entitlement gate.
#
# Scope is main-push (auto) + manual web trigger ONLY — never
# merge-request pipelines — so it verifies real production state, not an
# MR's un-deployed code, and a still-broken prod cannot red unrelated
# feature MRs. It carries no `needs:`, so it runs after the `test` stage
# (and the non-blocking manual `deploy` stage); that natural delay also
# gives the Netlify webhook publish time to land before the suite probes.
#
# No JWTs required to run: without GOLDEN_FLOW_PREMIUM_JWT +
# GOLDEN_FLOW_FREE_JWT it runs the no-token smoke (AUTH CONFIG + TTS +
# SIGNIN). Set both as masked CI/CD variables to promote it to the full
# five-flow gate (adds FOLLOW + GATE). The tests use only Playwright's
# `request` fixture (no browser), so no chromium install is needed.
golden-flows-prod:
  <<: [*node_job, *local_runner]
  stage: verify
  allow_failure: false
  retry: 1
  cache:
    <<: *npm_cache_def
    policy: pull
  rules:
    - if: '$MERCYB_SHARED_RUNNER_FALLBACK == "1"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
    - when: never
  script:
    - |
      if [ -n "${GOLDEN_FLOW_PREMIUM_JWT:-}" ] && [ -n "${GOLDEN_FLOW_FREE_JWT:-}" ]; then
        echo "Prod test JWTs present — running the full five-flow golden suite."
        npm run verify:golden-flows
      else
        echo "GOLDEN_FLOW_PREMIUM_JWT / GOLDEN_FLOW_FREE_JWT not set — running the no-token smoke (AUTH CONFIG + TTS + SIGNIN); FOLLOW + GATE skip."
        GOLDEN_FLOW_ALLOW_MISSING_SECRETS=1 npm run verify:golden-flows
      fi

# ── `backup` stage (unchanged from prior version) ──────────────────────

# postgres:17-alpine ships pg_dump + pg_restore. We add gpg (gnupg) and
# rclone via apk so the same image carries the whole pipeline. The major
# version must match (or exceed) the server: pg_dump refuses to dump a
# newer-major server, so the prod Postgres 17.x server needs pg_dump 17.x
# (pg_dump 16.x aborts with a version-mismatch error against a 17.6 server).
.backup_image: &backup_image
  image: postgres:17-alpine
  before_script:
    - apk add --no-cache --quiet gnupg rclone bash coreutils
    # Sanity check: the toolchain is present. Never echo env values.
    - command -v pg_dump
    - command -v gpg
    - command -v rclone
    - command -v bash

# Shared dump-and-upload body. Refer to scripts/db-backup/README.md for
# the rclone retention/prune commands that consume these date-bucketed
# folders.
.backup_script: &backup_script
  - mkdir -p "$BACKUP_OUTPUT_DIR"
  - export RCLONE_CONFIG="$RCLONE_CONFIG"
  # Run the dump script. It prints exactly two OK lines on success:
  #   OK <schema-file> <bytes>
  #   OK <full-file>   <bytes>
  - SUMMARY="$(bash scripts/db-backup/nightly-dump.sh)"
  - echo "$SUMMARY"
  # Pull the two file paths out of the OK summary lines.
  - SCHEMA_PATH="$(printf '%s' "$SUMMARY" | awk '/^OK /{print $2}' | sed -n '1p')"
  - FULL_PATH="$(printf '%s'   "$SUMMARY" | awk '/^OK /{print $2}' | sed -n '2p')"
  # Date-bucket the remote path so the rclone-prune commands in the
  # README can target daily / weekly / monthly subfolders cleanly:
  #   - daily/    every night
  #   - weekly/   on Sundays (day-of-week == 7 in ISO terms)
  #   - monthly/  on the 1st of the month
  - DOW="$(date -u +%u)"          # 1 (Mon) .. 7 (Sun)
  - DOM="$(date -u +%d)"          # 01..31
  - rclone copy --immutable "$SCHEMA_PATH" "$RCLONE_CONFIG_REMOTE/daily/"
  - rclone copy --immutable "$FULL_PATH"   "$RCLONE_CONFIG_REMOTE/daily/"
  - 'if [ "$DOW" = "7" ]; then rclone copy --immutable "$SCHEMA_PATH" "$RCLONE_CONFIG_REMOTE/weekly/"; rclone copy --immutable "$FULL_PATH" "$RCLONE_CONFIG_REMOTE/weekly/"; fi'
  - 'if [ "$DOM" = "01" ]; then rclone copy --immutable "$SCHEMA_PATH" "$RCLONE_CONFIG_REMOTE/monthly/"; rclone copy --immutable "$FULL_PATH" "$RCLONE_CONFIG_REMOTE/monthly/"; fi'
  - echo "Uploaded schema=$SCHEMA_PATH full=$FULL_PATH to $RCLONE_CONFIG_REMOTE"

# ── Nightly scheduled backup ───────────────────────────────────────────
#
# Required CI/CD variables (configure under Settings → CI/CD → Variables,
# all "protected", "masked" where the value format permits):
#
#   DATABASE_URL          masked     postgres connection string for prod
#                                    (or SUPABASE_DB_URL as fallback)
#   GPG_PUBLIC_KEY_FILE   file type  armored public key (multi-line file)
#                                    (or GPG_RECIPIENT_KEY_ID with a key
#                                    id if the keyring is preloaded — but
#                                    GitLab runners are fresh per job so
#                                    GPG_PUBLIC_KEY_FILE is the practical
#                                    choice in CI)
#   RCLONE_CONFIG         file type  contents of ~/.config/rclone/rclone.conf
#   RCLONE_CONFIG_REMOTE  protected  remote+path, e.g. "b2:mercyb-backups/prod"
#
# Both GPG_PUBLIC_KEY_FILE and RCLONE_CONFIG are GitLab "file"-type
# variables: GitLab writes their contents to a path inside the job
# workspace and exposes that path through the env var. Our dump script
# detects that GPG_PUBLIC_KEY_FILE is a file path and imports the key
# on the fly.

nightly-db-backup:
  <<: *backup_image
  stage: backup
  rules:
    # Schedule-only. Never runs on merge requests, pushes, or tags.
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  variables:
    BACKUP_OUTPUT_DIR: "$CI_PROJECT_DIR/_backup_out"
    BACKUP_ENV_LABEL: "prod"
  script: *backup_script
  artifacts:
    # Keep the encrypted dumps as job artifacts for 7 days — a secondary
    # safety net behind the object-store upload. Dumps are encrypted, so
    # artifact visibility doesn't expose data.
    when: on_success
    expire_in: 7 days
    paths:
      - _backup_out/*.dump.gpg

# ── Manual "test the pipeline" job ─────────────────────────────────────
#
# Lets Chau trigger a one-off backup from the GitLab UI to validate the
# full pipeline without waiting for the schedule. It uses the same
# script and the same CI/CD variables as the scheduled job, so a green
# manual run means the schedule will also work.

test-db-backup-now:
  <<: *backup_image
  stage: backup
  rules:
    # Operator-triggered main pipelines only, AND manual gate.
    # `web` covers the GitLab UI; `api` lets maintainers run the same
    # validation job through glab/API without waiting for the schedule.
    - if: '$CI_COMMIT_BRANCH == "main" && ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api")'
      when: manual
  variables:
    BACKUP_OUTPUT_DIR: "$CI_PROJECT_DIR/_backup_out"
    BACKUP_ENV_LABEL: "prod"
  script: *backup_script
  artifacts:
    when: on_success
    expire_in: 7 days
    paths:
      - _backup_out/*.dump.gpg
