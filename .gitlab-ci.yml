# .gitlab-ci.yml
#
# GitLab CI for MercyB. Two concerns live here:
#
#   1. **`test` stage** — pull-request and push-to-main gates that
#      mirror `.github/workflows/ci.yml`. Until this port, the GitLab
#      pipeline only ran the `backup` stage on schedules, so every
#      "pipeline green" badge on a merge request was a trivial empty-
#      pipeline pass. The `.github/workflows/ci.yml` file is kept on
#      disk for reference until this port is proven over a few MRs.
#
#   2. **`backup` stage** — nightly external Postgres dumps (preserved
#      verbatim from the prior version of this file). See
#      `scripts/db-backup/README.md` for the full design.
#
# Job naming follows the same mapping as the GitHub workflow:
#   - `build`              → "Build and Test" in GitHub
#   - `lint`               → "Lint Code"
#   - `validate-rooms`     → "Validate Rooms"
#   - `module-boundaries`  → "Module Boundaries"  (informational, not yet
#                            in any required-checks ruleset — see memory
#                            `project_ci_workflow_consolidation`)
#
# Things deliberately NOT ported:
#   - GitHub Actions specifics (`actions/checkout@v4`, `actions/setup-node@v4`).
#     GitLab clones the project automatically and the image carries Node.
#   - Vercel-specific deploy steps. Netlify auto-deploys via its own
#     GitLab integration; CI does not deploy.
#   - Other workflows under `.github/workflows/` (performance-ci,
#     mutation-testing, lighthouse, etc.). They moved to schedule /
#     workflow_dispatch / push:main in the GitHub consolidation and
#     belong to follow-up MRs.

stages:
  - test
  - deploy
  - verify
  - backup

# ── Pipeline auto-cancel for main-branch merge storms ──────────────────
#
# On a merge storm (rapid successive pushes to main) the runner can get
# backlogged with stale test/build pipelines for commits that are already
# superseded. `auto_cancel: on_new_commit: interruptible` cancels any job
# that has `interruptible: true` when a newer pipeline starts on the same
# ref, while leaving jobs with `interruptible: false` (golden-flows-prod,
# post-merge-worktree-reaper) untouched — those must run to completion even
# if a newer commit arrives, because they verify production state and clean
# up host worktrees respectively.
#
# MR-pipeline behavior is unchanged: the `when: always` fallback rule lets
# all other pipeline sources pass through without the auto_cancel override.
workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      auto_cancel:
        on_new_commit: interruptible
    - when: always

# ── Global CI tuning (Lane C: faster feedback) ─────────────────────────
#
# The local Mac runner can run multiple jobs at once. Keep each job in a
# job-specific checkout so concurrent get_sources/cleanup steps cannot corrupt
# a shared worktree. The local shell runner has shown collisions even under the
# runner-slot path, so include both pipeline and job ids. The path must stay
# under $CI_BUILDS_DIR.
#
# The remaining knobs trim the cache archive/extract tax that wraps each job
# (a trace showed ~15s to save + ~6s to restore the node_modules cache, per job):
#   - FF_USE_FASTZIP            parallel zip impl; the large node_modules
#                               cache (~1756 pkgs) archives far faster
#                               than the default gzip path.
#   - CACHE_COMPRESSION_LEVEL   `fast` trades a little cache size for
#                               speed. The cache is local-only on this
#                               runner ("stored only locally"), so the
#                               extra bytes cost nothing.
#   - TRANSFER_METER_FREQUENCY  progress logging cadence only; no
#                               behaviour change.
#   - GIT_DEPTH                 bounded shallow clone. CI's only git usage
#                               (status/diff/ls-files in the registry-drift
#                               and check-no-raw-react-lazy steps) reads
#                               the working tree, never deep history.
variables:
  FF_USE_FASTZIP: "true"
  CACHE_COMPRESSION_LEVEL: "fast"
  TRANSFER_METER_FREQUENCY: "2s"
  GIT_DEPTH: "20"
  GIT_CLONE_PATH: "$CI_BUILDS_DIR/$CI_PIPELINE_ID/$CI_JOB_ID/$CI_PROJECT_PATH_SLUG"

# ── Shared anchors for the `test` stage ────────────────────────────────
#
# `node:24-bookworm-slim` is the GitLab CI base image. Debian-slim is
# wider-compatibility than Alpine for the project's native deps; the
# size cost (~150 MB) is paid once per runner cache.

# Reusable npm cache definition (key + paths only). Each job picks a
# `policy`. The key tracks package-lock.json so a lockfile change
# invalidates the cache and forces a fresh install.
#
# Producer/consumer split: `build` runs first and is the cache PRODUCER
# (`pull-push`). The lighter jobs (lint / validate-rooms /
# module-boundaries) are CONSUMERS (`pull`) — they still run `npm ci`, so
# a cache miss is always safe; they simply stop re-archiving an identical
# node_modules (~15s each, per the trace). On a `concurrent = 1` runner
# those three saves are pure serial dead time, so dropping them comes off
# the pipeline wall-clock directly. Shared-runner fallback jobs keep
# `pull-push` (the anchor default) because they run on a different runner
# with its own cold local cache and must seed it themselves.
.npm_cache_def: &npm_cache_def
  key:
    files:
      - package-lock.json
  paths:
    - node_modules/
    - .npm/

.node_job: &node_job
  image: node:24-bookworm-slim
  interruptible: true
  cache:
    <<: *npm_cache_def
    policy: pull-push
  before_script:
    # [B3 builds-reaper] Bound disk on the macOS shell runners. Every job gets a
    # unique GIT_CLONE_PATH ($CI_BUILDS_DIR/$CI_PIPELINE_ID/$CI_JOB_ID/...) and the
    # runner never auto-cleans custom build dirs, so full checkouts + their
    # node_modules accumulate until disk fills. Numeric-name match scopes this to
    # MercyB's GIT_CLONE_PATH layout (won't touch other projects' default build
    # dirs) and we NEVER touch the current pipeline.
    #
    # Two prune triggers (a single day of pipelines filled the small-disk
    # runner-2 / "the Air" overnight under the old 24h age — down to 119Mi free):
    #   1. AGE — prune non-current pipeline dirs older than REAP_AGE_MIN MINUTES
    #      (default 120 ≈ 2h). Uses `find -mmin`, so the knob is minutes, not the
    #      old -mtime days (2h isn't expressible in -mtime). Tune via REAP_AGE_MIN.
    #   2. DISK PRESSURE — if the builds volume is at/above REAP_FULL_PCT used%
    #      (default 90), ignore the age floor but only reap pipeline dirs that do
    #      NOT contain a recent active-job marker. This prevents a newer job from
    #      deleting an older still-running job's current working directory, which
    #      shows up as uv_cwd/ENOENT during npm ci. Markers older than
    #      REAP_ACTIVE_MARKER_MAX_MIN (default 360min, well past the CI timeout)
    #      are treated as stale so killed jobs do not pin disk forever.
    #
    # DRY-RUN BY DEFAULT — this is the first destructive filesystem op on CI
    # infra, so it earns one clean dry-run: it logs CI_BUILDS_DIR, the resolved
    # trigger, and every target it WOULD remove, and fires NO rm. After Chau
    # eyeballs that CI_BUILDS_DIR resolved correctly and every target is genuinely
    # a stale/non-current pipeline dir, flip to live by setting CI/CD variable
    # REAP_LIVE=1 (or changing the default below).
    - |
      if [ -n "$CI_BUILDS_DIR" ] && [ "$(uname -s)" = "Darwin" ]; then
        ACTIVE_MARKER="$CI_PROJECT_DIR/.ci-active-job"
        printf 'job=%s\npipeline=%s\nstarted=%s\n' "$CI_JOB_ID" "$CI_PIPELINE_ID" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$ACTIVE_MARKER"
        trap 'rm -f "$ACTIVE_MARKER"' EXIT
        REAP_AGE_MIN="${REAP_AGE_MIN:-120}"
        REAP_FULL_PCT="${REAP_FULL_PCT:-90}"
        REAP_ACTIVE_MARKER_MAX_MIN="${REAP_ACTIVE_MARKER_MAX_MIN:-360}"
        REAP_MODE="dry-run"; [ "${REAP_LIVE:-0}" = "1" ] && REAP_MODE="live"
        AVAIL_BYTES="$(df -Pk "$CI_BUILDS_DIR" 2>/dev/null | awk 'NR==2 {print $4 * 1024}')"
        USED_PCT="$(df -P "$CI_BUILDS_DIR" 2>/dev/null | awk 'NR==2 {gsub(/%/,"",$5); print $5}')"
        if [ -n "$USED_PCT" ] && [ "$USED_PCT" -ge "$REAP_FULL_PCT" ]; then
          REAP_TRIGGER="disk-pressure(${USED_PCT}%>=${REAP_FULL_PCT}%)"; FIND_AGE="-mmin +0"
        else
          REAP_TRIGGER="age(>${REAP_AGE_MIN}min)"; FIND_AGE="-mmin +$REAP_AGE_MIN"
        fi
        echo "[B3 builds-reaper] CI_BUILDS_DIR=$CI_BUILDS_DIR current=$CI_PIPELINE_ID used=${USED_PCT:-?}% avail_bytes=${AVAIL_BYTES:-?} trigger=$REAP_TRIGGER mode=$REAP_MODE runner=${CI_RUNNER_DESCRIPTION:-unknown}"
        STALE="$(
          find "$CI_BUILDS_DIR" -mindepth 1 -maxdepth 1 -type d -name '[0-9]*' ! -name "$CI_PIPELINE_ID" $FIND_AGE -print 2>/dev/null |
          while IFS= read -r d; do
            if find "$d" -mindepth 3 -maxdepth 3 -name .ci-active-job -type f -mmin "-$REAP_ACTIVE_MARKER_MAX_MIN" -print -quit 2>/dev/null | grep -q .; then
              echo "[B3 builds-reaper] skip active pipeline dir: $d" >&2
            else
              echo "$d"
            fi
          done
        )"
        if [ -z "$STALE" ]; then
          echo "[B3 builds-reaper] no prunable pipeline build dirs (trigger=$REAP_TRIGGER) — nothing to do"
        elif [ "$REAP_MODE" = "live" ]; then
          echo "[B3 builds-reaper] LIVE — removing pipeline build dirs (trigger=$REAP_TRIGGER):"
          echo "$STALE"
          echo "$STALE" | while IFS= read -r d; do [ -n "$d" ] && rm -rf -- "$d"; done 2>/dev/null || true
        else
          echo "[B3 builds-reaper] DRY-RUN — would remove the following (NO rm fired; set REAP_LIVE=1 to enable):"
          echo "$STALE"
        fi
      fi
    # `--legacy-peer-deps` mirrors the GitHub workflow's flag — the
    # repo's peer-dep tree currently requires it.
    - sleep $((RANDOM % 60))
    - rm -rf node_modules/.deno
    - npm ci --legacy-peer-deps --cache .npm --prefer-offline ${NPM_CI_EXTRA_FLAGS:-}

# Local runner jobs are explicitly tagged so the Mac runner can keep
# "run untagged jobs" disabled. Shared-runner fallbacks are separate
# manual jobs with no tags and only appear when a pipeline is started
# with MERCYB_SHARED_RUNNER_FALLBACK=1.
#
# `isolated-builds` routes these jobs to the runner configured with
# [runners.custom_build_dir] enabled, which is required for GIT_CLONE_PATH.

.mac_pre_get_sources_hooks: &mac_pre_get_sources_hooks
  pre_get_sources_script:
      - |
        # Pre-checkout stale-build reaper. Runs on ALL pipelines (MR/branch/main-push),
        # not just main-push: MR pipelines were the ones starving the runner's disk
        # floor (see !568/!598). Safety: only touches numeric pipeline dirs under
        # gitlab-runner-builds; always skips the current pipeline id.
        # Guard order per candidate dir:
        #   1. GitLab API pipeline-status check via CI_JOB_TOKEN (primary — logs verdict
        #      for every dir; skips if status is running/pending/created/preparing/
        #      waiting_for_resource); falls through on curl failure/404.
        #   2. .ci-active-job marker freshness check (belt-and-suspenders; threshold
        #      MERCYB_PRECHECKOUT_MARKER_AGE_MIN, default 360min=CI timeout ceiling).
        #   3. lsof open-file check.
        #   4. mtime fallback (MERCYB_PRECHECKOUT_REAP_AGE_MIN, default 90min) — last
        #      resort only; tracks mtime-only-skipped dirs for the emergency valve.
        # Emergency relief valve: if after the loop disk < floor AND the only skips
        # were mtime-gated (API/marker never fired), delete the oldest such dir with
        # a loud EMERGENCY-RELIEF log line — a stale deleted dir beats a fail-closed
        # fleet.
        # Kill-switch: MERCYB_PRECHECKOUT_REAPER_DISABLE=1.
        if [ "${MERCYB_PRECHECKOUT_REAPER_DISABLE:-0}" != "1" ] && [ -n "${CI_BUILDS_DIR:-}" ] && [ "$(uname -s)" = "Darwin" ]; then
          REAPER_ROOT="$CI_BUILDS_DIR"
          while [ ! -d "$REAPER_ROOT" ] && [ "$REAPER_ROOT" != "/" ]; do
            REAPER_ROOT="$(dirname "$REAPER_ROOT")"
          done
          if [ "$(basename "$REAPER_ROOT")" = "gitlab-runner-builds" ]; then
            echo "[post-merge-precheckout-reaper] before df -h /"
            df -h / | sed 's/^/[post-merge-precheckout-reaper] /'
            echo "[post-merge-precheckout-reaper] root=$REAPER_ROOT current_pipeline=${CI_PIPELINE_ID:-unknown}"
            PRECHECKOUT_REAP_AGE_MIN="${MERCYB_PRECHECKOUT_REAP_AGE_MIN:-90}"
            PRECHECKOUT_MARKER_AGE_MIN="${MERCYB_PRECHECKOUT_MARKER_AGE_MIN:-360}"
            _DISK_FLOOR_KB="20971520"
            _MTIME_SKIP_TMP="$(mktemp 2>/dev/null || printf '%s' "/tmp/.precheckout-reaper-mtime-$$")"
            find "$REAPER_ROOT" -mindepth 1 -maxdepth 1 -type d -name '[0-9]*' -print 2>/dev/null | sort | while IFS= read -r d; do
              [ -n "$d" ] || continue
              _pid="$(basename "$d")"
              if [ "$_pid" = "${CI_PIPELINE_ID:-}" ]; then
                echo "[post-merge-precheckout-reaper] SKIP current-pipeline path=$d"
                continue
              fi
              # Guard 1: GitLab API pipeline-status (CI_JOB_TOKEN).
              if [ -n "${CI_JOB_TOKEN:-}" ] && [ -n "${CI_SERVER_URL:-}" ] && [ -n "${CI_PROJECT_ID:-}" ]; then
                _api_resp="$(curl -sf --max-time 5 \
                  -H "JOB-TOKEN: ${CI_JOB_TOKEN}" \
                  "${CI_SERVER_URL}/api/v4/projects/${CI_PROJECT_ID}/pipelines/${_pid}" \
                  2>/dev/null || true)"
                _api_status="$(printf '%s' "$_api_resp" | grep -o '"status":"[^"]*"' | head -1 | sed 's/.*":"\([^"]*\)".*/\1/')"
                if [ -n "$_api_status" ]; then
                  echo "[post-merge-precheckout-reaper] API-check pipeline=${_pid} status=${_api_status} path=$d"
                  case "$_api_status" in
                    running|pending|created|preparing|waiting_for_resource)
                      echo "[post-merge-precheckout-reaper] SKIP api-active pipeline=${_pid} status=${_api_status} path=$d"
                      continue
                      ;;
                  esac
                else
                  echo "[post-merge-precheckout-reaper] API-check pipeline=${_pid} status=unavailable path=$d"
                fi
              else
                echo "[post-merge-precheckout-reaper] API-check SKIP no-token path=$d"
              fi
              # Guard 2: .ci-active-job marker freshness.
              if find "$d" -mindepth 3 -maxdepth 3 -name .ci-active-job -type f -mmin "-${PRECHECKOUT_MARKER_AGE_MIN}" -print -quit 2>/dev/null | grep -q .; then
                echo "[post-merge-precheckout-reaper] SKIP active-job-marker path=$d"
                continue
              fi
              # Guard 3: lsof open-file check.
              if command -v lsof >/dev/null 2>&1 && lsof -t +D "$d" >/dev/null 2>&1; then
                echo "[post-merge-precheckout-reaper] SKIP active-process path=$d"
                continue
              fi
              # Guard 4: mtime fallback (last resort — tracks for emergency valve).
              if find "$d" -maxdepth 0 -mmin "-${PRECHECKOUT_REAP_AGE_MIN}" -print 2>/dev/null | grep -q .; then
                echo "[post-merge-precheckout-reaper] SKIP mtime-only path=$d age<${PRECHECKOUT_REAP_AGE_MIN}min"
                printf '%s\n' "$d" >> "$_MTIME_SKIP_TMP"
                continue
              fi
              echo "[post-merge-precheckout-reaper] REMOVE path=$d safe=non-current-runner-pipeline-dir age>=${PRECHECKOUT_REAP_AGE_MIN}min"
              rm -rf -- "$d" || echo "[post-merge-precheckout-reaper] WARN remove-failed path=$d"
            done
            # Emergency relief valve: if mtime-only skips left disk below floor, remove oldest.
            if [ -s "$_MTIME_SKIP_TMP" ]; then
              _free_now="$(df -Pk "$REAPER_ROOT" 2>/dev/null | awk 'NR==2 {print $4}')"
              if [ -n "$_free_now" ] && [ "$_free_now" -lt "$_DISK_FLOOR_KB" ]; then
                _oldest="$(head -1 "$_MTIME_SKIP_TMP")"
                if [ -n "$_oldest" ] && [ -d "$_oldest" ]; then
                  echo "[post-merge-precheckout-reaper] EMERGENCY-RELIEF free=${_free_now}KB < floor=${_DISK_FLOOR_KB}KB — removing oldest mtime-only-skipped dir: $_oldest"
                  rm -rf -- "$_oldest" || echo "[post-merge-precheckout-reaper] WARN emergency-remove-failed path=$_oldest"
                fi
              fi
            fi
            rm -f "$_MTIME_SKIP_TMP" 2>/dev/null || true
            echo "[post-merge-precheckout-reaper] after df -h /"
            df -h / | sed 's/^/[post-merge-precheckout-reaper] /'
          else
            echo "[post-merge-precheckout-reaper] SKIP unapproved-root path=$REAPER_ROOT"
          fi
        fi
        DISK_FLOOR_KB="20971520"
        TARGET="${CI_BUILDS_DIR:-$PWD}"
        while [ ! -d "$TARGET" ] && [ "$TARGET" != "/" ]; do
          TARGET="$(dirname "$TARGET")"
        done
        FREE_KB="$(df -Pk "$TARGET" 2>/dev/null | awk 'NR==2 {print $4}')"
        if [ -z "$FREE_KB" ]; then
          echo "DISK_GATE: unknownGB < 20GB floor — job refused (could not read build volume target '$TARGET')" >&2
          exit 1
        fi
        FREE_GB="$(awk "BEGIN {printf \"%.2f\", $FREE_KB/1048576}")"
        if [ "$FREE_KB" -lt "$DISK_FLOOR_KB" ]; then
          echo "DISK_GATE: ${FREE_GB}GB < 20GB floor — job refused (target=$TARGET runner=${CI_RUNNER_DESCRIPTION:-unknown})" >&2
          exit 1
        fi
        echo "DISK_GATE: ${FREE_GB}GB >= 20GB floor — job accepted (target=$TARGET runner=${CI_RUNNER_DESCRIPTION:-unknown})"

.local_runner: &local_runner
  tags:
    - local
    - mac
    - mercyb
    - isolated-builds
  hooks: *mac_pre_get_sources_hooks

# Changes that affect the full app build/test path. Docs-only changes do
# not need the heavy build job on merge-request pipelines; protected
# branches still run the full validation below regardless of diff shape.

.app_validation_changes: &app_validation_changes
  - package.json
  - package-lock.json
  - tsconfig*.json
  - vite.config.*
  - vitest.config.*
  - index.html
  - src/**/*
  - public/**/*
  - scripts/**/*
  - tests/**/*
  - supabase/functions/**/*
  - supabase/config.toml
  - .gitlab-ci.yml

.lint_validation_changes: &lint_validation_changes
  - package.json
  - package-lock.json
  - eslint.config.*
  - tsconfig*.json
  - src/**/*
  - scripts/**/*
  - tests/**/*
  - .gitlab-ci.yml

