# PATH: supabase/config.toml

project_id = "buemdfxyhxunzpgdoqin"

# =========================
# EMAIL
# =========================
[functions.email-broadcast]
verify_jwt = false

[functions.email-automations]
verify_jwt = false

[functions.send-redeem-email]
verify_jwt = false

[functions.send-pending-emails]
verify_jwt = false

# RFC 8058 one-click unsubscribe endpoint. Public by design: the opaque
# per-user profiles.email_unsubscribe_token IS the credential (same
# trust model as the unsubscribe_by_token RPC's anon grant). Never
# requires a JWT — mail clients POST it unauthenticated.
[functions.email-unsubscribe]
verify_jwt = false

# L6 — Parent / Family layer weekly digest (Q8=A opt-in). Cron-triggered
# (migration 20260528120000) via the default "daily_pass" action, so the
# function must accept unauthenticated calls; admin-only actions
# (send_test / run_now) do their own get_admin_level check internally.
[functions.parent-weekly-digest]
verify_jwt = false

# Track 1 — D1/D7/D30 cohort retention aggregator. Cron-triggered (pg_cron;
# schedule drafted in migration 20260701120000, applied manually). Accepts
# unauthenticated calls but enforces its own ADMIN_CRON_SECRET header check,
# then writes cohort_retention_daily with the service-role key.
[functions.cohort-retention-aggregator]
verify_jwt = false


# Track 2 — Learner interaction capture (anonymized, consent-gated).
# verify_jwt = true: only authenticated sessions reach the function;
# it derives user_id from the JWT, HMACs it, and writes with service-role.
[functions.learner-capture]
verify_jwt = true


